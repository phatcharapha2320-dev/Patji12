<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หุ่นยนต์ครูน้อย</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Mali:wght@400;600&family=Sarabun:wght@400;500;700&display=swap');

        :root {
            color-scheme: light;
            --bg-chalkboard: #ffe6ea;
            --text-main: #5c4349;
            --chalk-line: rgba(255, 255, 255, 0.7);
            --chalk-border: #ffb6c1;
            
            --accent-yellow: #ffdf6b;
            --accent-red: #ff9a9e;
            --accent-blue: #a1c9f1;
            --accent-green: #98e698;
            
            --block-action: #a1c9f1;
            --block-loop: #ffdf6b;
            --block-cond: #ff9a9e;
            
            --focus-ring: 3px solid #ff9a9e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-chalkboard);
            color: var(--text-main);
            font-family: 'Sarabun', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle, rgba(255, 182, 193, 0.6) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        h1, h2, h3, h4, .mali-font {
            font-family: 'Mali', cursive;
        }

        button {
            font-family: 'Sarabun', sans-serif;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            transition: transform 0.1s, opacity 0.2s;
            color: #111;
        }

        button:focus-visible {
            outline: var(--focus-ring);
            outline-offset: 2px;
        }

        button:active {
            transform: scale(0.95);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        header {
            padding: 1rem;
            border-bottom: 2px solid var(--chalk-border);
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        .level-selector {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .btn-level {
            width: 40px;
            height: 40px;
            background: var(--bg-chalkboard);
            border: 2px solid var(--chalk-border);
            color: var(--text-main);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .btn-level.active {
            background: var(--accent-yellow);
            color: #111;
            border-color: var(--accent-yellow);
        }

        .btn-level.locked {
            opacity: 0.3;
        }

        .main-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            flex: 1;
            gap: 1rem;
            padding: 1rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        @media (max-width: 800px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            border: 2px dashed var(--chalk-border);
            border-radius: 12px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            background: rgba(255, 255, 255, 0.5);
        }

        canvas {
            background: rgba(255, 255, 255, 0.8);
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1/1;
            margin: 0 auto;
            display: block;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.5rem;
        }

        .btn-primary { background: var(--accent-green); }
        .btn-warning { background: var(--accent-yellow); }
        .btn-danger { background: var(--accent-red); }
        .btn-info { background: var(--accent-blue); }

        .btn {
            padding: 0.75rem;
            font-size: 1rem;
        }

        .message-box {
            padding: 1rem;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.8);
            text-align: center;
            font-weight: bold;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .msg-success { color: #3a9e52; border: 1px solid var(--accent-green); }
        .msg-error { color: #d1565a; border: 1px solid var(--accent-red); }

        .block-palette {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--chalk-border);
        }

        .block {
            padding: 0.5rem 0.75rem;
            border-radius: 6px;
            font-weight: bold;
            color: #111;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 2px 2px 0 rgba(0,0,0,0.5);
            font-size: 0.9rem;
        }

        .block-action { background: var(--block-action); }
        .block-loop { background: var(--block-loop); }
        .block-cond { background: var(--block-cond); }

        .program-area {
            flex: 1;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 8px;
            padding: 1rem;
            overflow-y: auto;
            min-height: 300px;
        }

        .prog-node {
            margin-bottom: 0.25rem;
        }

        .prog-block {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 0.25rem;
            border: 2px solid transparent;
        }

        .prog-block.running {
            border-color: #ff9a9e;
            box-shadow: 0 0 10px rgba(255, 154, 158, 0.8);
        }

        .prog-children {
            margin-left: 1.5rem;
            padding-left: 0.5rem;
            border-left: 2px dashed rgba(0, 0, 0, 0.1);
            min-height: 10px;
        }

        .target-active {
            background: rgba(255, 255, 255, 0.8) !important;
            border: 2px dashed var(--accent-red) !important;
        }

        .btn-small {
            padding: 0.25rem 0.5rem;
            font-size: 0.8rem;
            background: rgba(255, 255, 255, 0.9);
            color: var(--text-main);
            border: 1px solid var(--chalk-border);
        }

        .select-target-btn {
            background: var(--bg-chalkboard);
            color: var(--accent-yellow);
            border: 1px solid var(--accent-yellow);
        }

        .select-target-btn.active {
            background: var(--accent-yellow);
            color: #111;
        }

        .speed-control {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .teacher-corner {
            margin: 1rem;
            border: 2px solid var(--accent-blue);
            border-radius: 8px;
            overflow: hidden;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
            width: calc(100% - 2rem);
        }

        .teacher-summary {
            background: rgba(79, 172, 254, 0.2);
            padding: 1rem;
            font-weight: bold;
            cursor: pointer;
            color: var(--accent-blue);
            list-style: none;
        }
        
        .teacher-summary::-webkit-details-marker {
            display: none;
        }

        .teacher-content {
            padding: 1rem;
            background: rgba(255, 255, 255, 0.6);
        }
        .teacher-content h4 {
            color: #d17585;
            margin-top: 1rem;
            margin-bottom: 0.5rem;
        }
        .teacher-content ul {
            padding-left: 1.5rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>

    <header>
        <div>
            <h1 class="mali-font" style="color: #d17585;">หุ่นยนต์ครูน้อย</h1>
            <p>ดาวรวม: <span id="total-stars">0</span>/18</p>
        </div>
        <div class="level-selector" id="level-selector">
            <!-- Level buttons generated by JS -->
        </div>
    </header>

    <div class="main-container">
        <!-- Left Panel: Game & Map -->
        <div class="panel">
            <div>
                <span style="background: var(--accent-blue); color: #111; padding: 2px 8px; border-radius: 12px; font-size: 0.8rem; font-weight: bold;" id="level-concept">แนวคิด</span>
                <h2 id="level-title" class="mali-font" style="margin-top: 0.5rem;">ชื่อด่าน</h2>
                <p id="level-desc" style="color: #7a5c63; margin-bottom: 1rem;">คำอธิบายโจทย์</p>
            </div>
            
            <canvas id="game-canvas" width="400" height="400"></canvas>
            
            <div id="message-box" class="message-box">พร้อมทำงาน!</div>
            
            <div class="controls">
                <button class="btn btn-primary" id="btn-run">เริ่มทำงาน</button>
                <button class="btn btn-warning" id="btn-reset">เริ่มใหม่</button>
                <button class="btn btn-danger" id="btn-clear">ล้างโปรแกรม</button>
                <button class="btn btn-info" id="btn-solution">ดูแนวทาง</button>
            </div>
            <div class="speed-control">
                <label>ความเร็ว:</label>
                <button class="btn-small speed-btn" data-speed="1">ช้า</button>
                <button class="btn-small speed-btn" data-speed="2" style="background: var(--accent-red); color: white;">กลาง</button>
                <button class="btn-small speed-btn" data-speed="3">เร็ว</button>
            </div>
        </div>

        <!-- Right Panel: Programming -->
        <div class="panel">
            <h3 class="mali-font">กล่องเครื่องมือ</h3>
            <div class="block-palette" id="block-palette">
                <!-- Blocks generated by JS -->
            </div>
            
            <div style="display: flex; justify-content: space-between; align-items: baseline;">
                <h3 class="mali-font">โปรแกรม</h3>
                <span id="block-counter" style="font-size: 0.9rem; color: #7a5c63;">ใช้ 0 บล็อก (เป้าหมาย 3 ดาว: ไม่เกิน 0)</span>
            </div>
            
            <div class="program-area" id="program-area">
                <!-- Program nodes generated by JS -->
            </div>
            <button class="btn-small select-target-btn active" id="btn-target-root" style="margin-top: 0.5rem; width: 100%;">วางต่อท้ายสุด</button>
        </div>
    </div>

    <details class="teacher-corner">
        <summary class="teacher-summary mali-font">▶ มุมครู: คำแนะนำสำหรับการสอน (คลิกเพื่อเปิด)</summary>
        <div class="teacher-content" id="teacher-content">
            <!-- Teacher content generated by JS -->
        </div>
    </details>

    <script>
        // --- GAME DATA & LEVELS ---
        const LEVELS = [
            {
                id: 0, title: "ก้าวแรก", concept: "ลำดับขั้นตอน (Sequence)", par: 3,
                desc: "พาหุ่นยนต์เดินไปที่ธง",
                map: ["......", "......", "......", "......", "......", "S..G.."],
                startDir: 1, // 0:N, 1:E, 2:S, 3:W
                allowAdvanced: false,
                solution: [{type:'f'}, {type:'f'}, {type:'f'}],
                teacher: {
                    idea: "ด่านนี้สอนให้ผู้เรียนเข้าใจว่าคอมพิวเตอร์ทำงานตามคำสั่งทีละขั้นตอน (Sequence) จากบนลงล่าง การเรียงลำดับผิดจะทำให้ผลลัพธ์ผิดพลาด",
                    questions: ["ถ้านักเรียนสลับคำสั่งเดินหน้ากับเลี้ยว จะเกิดอะไรขึ้น?", "ในชีวิตประจำวัน มีกิจกรรมอะไรบ้างที่ต้องทำตามลำดับขั้นตอนอย่างเคร่งครัด?"]
                }
            },
            {
                id: 1, title: "เลี้ยวซ้ายขวา", concept: "ลำดับขั้นตอน (Sequence)", par: 7,
                desc: "พาหุ่นยนต์เดินไปที่ธง ระวังทิศทางให้ดี",
                map: ["......", "......", "...G..", "......", "......", "S....."],
                startDir: 0,
                allowAdvanced: false,
                solution: [{type:'f'}, {type:'f'}, {type:'f'}, {type:'r'}, {type:'f'}, {type:'f'}, {type:'f'}],
                teacher: {
                    idea: "ฝึกการจินตนาการเชิงพื้นที่ (Spatial Reasoning) ผู้เรียนต้องมองในมุมมองของหุ่นยนต์ (Egocentric) ไม่ใช่มุมมองจากด้านบน",
                    questions: ["นักเรียนมีเทคนิคอย่างไรในการจำทิศซ้ายขวาของหุ่นยนต์?", "ความผิดพลาดที่พบบ่อยในด่านนี้คืออะไร? (การลืมว่าหุ่นยนต์หันหน้าไปทางไหน)"]
                }
            },
            {
                id: 2, title: "ขั้นบันได", concept: "การวนซ้ำ (Iteration)", par: 6,
                desc: "พาหุ่นยนต์ไปที่ธง ลองใช้บล็อกวนซ้ำเพื่อลดจำนวนคำสั่ง",
                map: ["......", "......", "....G.", "......", "......", "S....."],
                startDir: 1,
                allowAdvanced: false,
                solution: [{type:'f'}, {type:'rep', val:3, children:[{type:'l'}, {type:'f'}, {type:'r'}, {type:'f'}]}],
                teacher: {
                    idea: "แนะนำแนวคิดการรู้จำรูปแบบ (Pattern Recognition) เมื่อเห็นชุดคำสั่งที่ซ้ำกัน สามารถรวบเข้าด้วยกันโดยใช้การวนซ้ำเพื่อลดความซ้ำซ้อน",
                    questions: ["นักเรียนมองเห็นรูปแบบที่ซ้ำกัน (Pattern) ในเส้นทางนี้คืออะไร?", "การใช้บล็อกวนซ้ำดีกว่าการเขียนคำสั่งเรียงกันยาวๆ อย่างไร?"]
                }
            },
            {
                id: 3, title: "เก็บดาว", concept: "การวนซ้ำ (Iteration)", par: 7,
                desc: "เก็บดาวให้ครบทุกดวงแล้วไปที่ธง",
                map: ["S..*..", "G.....", "......", "*..*..", "......", "......"],
                startDir: 1,
                allowAdvanced: false,
                solution: [{type:'rep', val:3, children:[{type:'f'}, {type:'f'}, {type:'f'}, {type:'r'}]}, {type:'f'}, {type:'f'}],
                teacher: {
                    idea: "บูรณาการการวนซ้ำเข้ากับการแก้ปัญหาที่ซับซ้อนขึ้น ผู้เรียนต้องมองหาจุดร่วมระหว่างเส้นทางระหว่างดวงดาว",
                    questions: ["เส้นทางระหว่างดาวแต่ละดวงมีความยาวและการเลี้ยวที่เหมือนกันหรือไม่?", "หากจำนวนดาวเพิ่มขึ้น โค้ดของเราจะต้องยาวขึ้นหรือไม่?"]
                }
            },
            {
                id: 4, title: "ทางตัน", concept: "เงื่อนไข (Condition)", par: 4,
                desc: "พาหุ่นยนต์อ้อมกำแพงไปที่ธง (ปลดล็อกบล็อกเงื่อนไข)",
                map: ["......", ".####.", ".####.", ".####.", ".####.", "S##G.."],
                startDir: 0,
                allowAdvanced: true,
                solution: [{type:'until', children:[{type:'ifw', children:[{type:'r'}]}, {type:'f'}]}],
                teacher: {
                    idea: "แนะนำโครงสร้างการตัดสินใจ (Selection/Condition) โปรแกรมสามารถตอบสนองต่อสภาพแวดล้อมที่เปลี่ยนไปได้ ไม่จำเป็นต้องระบุจำนวนก้าวที่แน่นอน",
                    questions: ["ทำไมเราจึงใช้ 'วนจนถึงธง' แทนการระบุจำนวนรอบที่แน่นอนในด่านนี้?", "เงื่อนไข 'ถ้าข้างหน้าเป็นกำแพง' ช่วยให้หุ่นยนต์ตัดสินใจได้อย่างไร?"]
                }
            },
            {
                id: 5, title: "ทางงู", concept: "ลูปซ้อนลูป (Nested Loops)", par: 11,
                desc: "เก็บดาวให้ครบและไปที่ธงโดยใช้คำสั่งให้น้อยที่สุด",
                map: ["S....*", "*.....", ".....*", "*.....", "G.....", "......"],
                startDir: 1,
                allowAdvanced: true,
                solution: [
                    {type:'rep', val:2, children:[
                        {type:'rep', val:5, children:[{type:'f'}]},
                        {type:'r'}, {type:'f'}, {type:'r'},
                        {type:'rep', val:5, children:[{type:'f'}]},
                        {type:'l'}, {type:'f'}, {type:'l'}
                    ]}
                ],
                teacher: {
                    idea: "สอนลูปซ้อนลูป (Nested Loops) การวนซ้ำสามารถอยู่ภายในการวนซ้ำอีกชั้นหนึ่งได้ เป็นแนวคิดสำคัญในการจัดการข้อมูลแบบตารางหรือรูปแบบที่ซับซ้อน",
                    questions: ["ลูปด้านในทำหน้าที่อะไร และลูปด้านนอกทำหน้าที่อะไร?", "ความสั้นของโปรแกรม (ใช้น้อยบล็อก) กับความอ่านง่ายของโปรแกรม ขัดแย้งกันหรือไม่? ในมุมครูควรประเมินนักเรียนอย่างไร?"]
                }
            }
        ];

        // --- STATE ---
        let currentLevelIndex = 0;
        let starsRecord = [0, 0, 0, 0, 0, 0];
        let programAst = [];
        let blockIdCounter = 1;
        let insertionTargetId = null; // null means root
        
        // Simulation / Animation state
        let simHistory = [];
        let animFrame = 0;
        let isPlaying = false;
        let playbackSpeed = 2; // 1, 2, 3
        let animationTimer = null;

        // Current UI Game State
        let robot = { x:0, y:0, dir:0 };
        let activeBlockId = null;
        let mapData = [];
        let collectedStars = [];

        // Prefers reduced motion
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        function init() {
            try {
                const saved = localStorage.getItem('krunoi_stars');
                if(saved) starsRecord = JSON.parse(saved);
            } catch(e) { console.log('Storage disabled'); }

            setupEvents();
            loadLevel(currentLevelIndex);
            updateUIStars();
        }

        function saveStars() {
            try {
                localStorage.setItem('krunoi_stars', JSON.stringify(starsRecord));
            } catch(e) {}
        }

        function countTotalStars() {
            return starsRecord.reduce((a, b) => a + b, 0);
        }

        function updateUIStars() {
            document.getElementById('total-stars').innerText = countTotalStars();
            const container = document.getElementById('level-selector');
            container.innerHTML = '';
            
            for(let i=0; i<LEVELS.length; i++) {
                const btn = document.createElement('button');
                btn.className = 'btn-level';
                btn.innerText = i + 1;
                
                // Unlocked if it's level 0, or previous level has >= 1 star
                const isUnlocked = i === 0 || starsRecord[i-1] > 0;
                
                if(!isUnlocked) {
                    btn.classList.add('locked');
                    btn.disabled = true;
                } else {
                    btn.onclick = () => loadLevel(i);
                    if(i === currentLevelIndex) btn.classList.add('active');
                }
                
                // Show stars
                if(starsRecord[i] > 0) {
                    const st = document.createElement('div');
                    st.style.position = 'absolute';
                    st.style.bottom = '-15px';
                    st.style.fontSize = '10px';
                    st.innerText = '★'.repeat(starsRecord[i]);
                    st.style.color = '#e89c25';
                    btn.style.position = 'relative';
                    btn.appendChild(st);
                }
                container.appendChild(btn);
            }
        }

        function loadLevel(idx) {
            stopAnimation();
            currentLevelIndex = idx;
            const lvl = LEVELS[idx];
            
            document.getElementById('level-concept').innerText = lvl.concept;
            document.getElementById('level-title').innerText = lvl.title;
            document.getElementById('level-desc').innerText = lvl.desc;
            
            // Render blocks
            renderBlockPalette(lvl.allowAdvanced);
            programAst = [];
            insertionTargetId = null;
            renderProgram();
            
            // Teacher content
            document.getElementById('teacher-content').innerHTML = `
                <p>${lvl.teacher.idea}</p>
                <h4>คำถามชวนอภิปราย</h4>
                <ul>
                    ${lvl.teacher.questions.map(q => `<li>${q}</li>`).join('')}
                </ul>
            `;
            
            resetMap();
            updateUIStars();
            showMessage("พร้อมทำงาน!", "");
        }

        function resetMap() {
            stopAnimation();
            const lvl = LEVELS[currentLevelIndex];
            mapData = lvl.map.map(row => row.split(''));
            collectedStars = [];
            
            // Find Start
            for(let y=0; y<6; y++) {
                for(let x=0; x<6; x++) {
                    if(mapData[y][x] === 'S') {
                        robot = { x: x, y: y, dir: lvl.startDir };
                    }
                }
            }
            activeBlockId = null;
            drawMap();
            showMessage("พร้อมทำงาน!", "");
        }

        function renderBlockPalette(allowAdvanced) {
            const p = document.getElementById('block-palette');
            p.innerHTML = '';
            
            const createBtn = (label, type, cssClass) => {
                const b = document.createElement('button');
                b.className = `block ${cssClass}`;
                b.innerText = label;
                b.onclick = () => addBlock(type);
                p.appendChild(b);
            };

            createBtn("เดินหน้า", "f", "block-action");
            createBtn("เลี้ยวซ้าย", "l", "block-action");
            createBtn("เลี้ยวขวา", "r", "block-action");
            
            // Repeat N
            const repDiv = document.createElement('div');
            repDiv.style.display = 'inline-flex';
            repDiv.style.gap = '4px';
            repDiv.style.alignItems = 'center';
            
            const repSel = document.createElement('select');
            repSel.id = 'repeat-val';
            repSel.style.padding = '4px';
            repSel.style.borderRadius = '4px';
            [2,3,4,5,6].forEach(v => {
                const opt = document.createElement('option');
                opt.value = v; opt.innerText = v;
                repSel.appendChild(opt);
            });
            
            const repBtn = document.createElement('button');
            repBtn.className = 'block block-loop';
            repBtn.innerText = "วนซ้ำ";
            repBtn.onclick = () => addBlock('rep', parseInt(document.getElementById('repeat-val').value));
            
            repDiv.appendChild(repBtn);
            repDiv.appendChild(repSel);
            repDiv.appendChild(document.createTextNode("รอบ"));
            p.appendChild(repDiv);

            if(allowAdvanced) {
                createBtn("วนจนถึงธง", "until", "block-loop");
                createBtn("ถ้าข้างหน้าเป็นกำแพง", "ifw", "block-cond");
            }
        }

        function createBlockObj(type, val = null) {
            const obj = { id: blockIdCounter++, type: type };
            if(type === 'rep') { obj.val = val; obj.children = []; }
            if(type === 'until' || type === 'ifw') { obj.children = []; }
            return obj;
        }

        function addBlock(type, val = null) {
            const newBlock = createBlockObj(type, val);
            
            if(insertionTargetId === null) {
                programAst.push(newBlock);
            } else {
                const target = findBlock(programAst, insertionTargetId);
                if(target && target.children) {
                    target.children.push(newBlock);
                } else {
                    programAst.push(newBlock); // fallback
                }
            }
            renderProgram();
        }

        function findBlock(ast, id) {
            for(let b of ast) {
                if(b.id === id) return b;
                if(b.children) {
                    const found = findBlock(b.children, id);
                    if(found) return found;
                }
            }
            return null;
        }

        function removeBlock(ast, id) {
            for(let i=0; i<ast.length; i++) {
                if(ast[i].id === id) {
                    ast.splice(i, 1);
                    return true;
                }
                if(ast[i].children) {
                    if(removeBlock(ast[i].children, id)) return true;
                }
            }
            return false;
        }

        function countTotalBlocks(ast) {
            let c = 0;
            for(let b of ast) {
                c++;
                if(b.children) c += countTotalBlocks(b.children);
            }
            return c;
        }

        function renderProgram() {
            const c = document.getElementById('program-area');
            c.innerHTML = '';
            
            function renderNode(ast, container) {
                for(let b of ast) {
                    const nodeDiv = document.createElement('div');
                    nodeDiv.className = 'prog-node';
                    
                    const blockHeader = document.createElement('div');
                    blockHeader.className = `block prog-block ${activeBlockId === b.id ? 'running' : ''}`;
                    if(b.type==='f'||b.type==='l'||b.type==='r') blockHeader.classList.add('block-action');
                    if(b.type==='rep'||b.type==='until') blockHeader.classList.add('block-loop');
                    if(b.type==='ifw') blockHeader.classList.add('block-cond');
                    
                    if(b.id === insertionTargetId) blockHeader.classList.add('target-active');

                    let label = "";
                    if(b.type === 'f') label = "เดินหน้า 1 ช่อง";
                    if(b.type === 'l') label = "เลี้ยวซ้าย";
                    if(b.type === 'r') label = "เลี้ยวขวา";
                    if(b.type === 'rep') label = `วนซ้ำ ${b.val} รอบ`;
                    if(b.type === 'until') label = "วนจนถึงธง";
                    if(b.type === 'ifw') label = "ถ้าข้างหน้าเป็นกำแพง";

                    blockHeader.innerHTML = `<span>${label}</span>`;
                    
                    const btnGroup = document.createElement('div');
                    btnGroup.style.display = 'flex';
                    btnGroup.style.gap = '4px';

                    if(b.children) {
                        const setTgtBtn = document.createElement('button');
                        setTgtBtn.className = 'btn-small';
                        setTgtBtn.innerText = "ใส่ในนี้";
                        setTgtBtn.onclick = (e) => {
                            e.stopPropagation();
                            insertionTargetId = b.id;
                            updateRootTargetBtn();
                            renderProgram();
                        };
                        btnGroup.appendChild(setTgtBtn);
                    }

                    const delBtn = document.createElement('button');
                    delBtn.className = 'btn-small';
                    delBtn.style.background = 'var(--accent-red)';
                    delBtn.innerText = "ลบ";
                    delBtn.onclick = (e) => {
                        e.stopPropagation();
                        removeBlock(programAst, b.id);
                        if(insertionTargetId === b.id) insertionTargetId = null;
                        updateRootTargetBtn();
                        renderProgram();
                    };
                    btnGroup.appendChild(delBtn);
                    blockHeader.appendChild(btnGroup);
                    nodeDiv.appendChild(blockHeader);

                    if(b.children) {
                        const childContainer = document.createElement('div');
                        childContainer.className = 'prog-children';
                        if(b.id === insertionTargetId) childContainer.classList.add('target-active');
                        renderNode(b.children, childContainer);
                        nodeDiv.appendChild(childContainer);
                    }
                    
                    container.appendChild(nodeDiv);
                }
            }
            
            renderNode(programAst, c);
            
            const total = countTotalBlocks(programAst);
            document.getElementById('block-counter').innerText = 
                `ใช้ ${total} บล็อก (เป้าหมาย 3 ดาว: ไม่เกิน ${LEVELS[currentLevelIndex].par})`;
            
            updateRootTargetBtn();
        }

        function updateRootTargetBtn() {
            const btn = document.getElementById('btn-target-root');
            if(insertionTargetId === null) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        }

        function cloneState(r, actId, cs) {
            return { x: r.x, y: r.y, dir: r.dir, activeId: actId, collectedStars: [...cs] };
        }

        function simulate() {
            const lvl = LEVELS[currentLevelIndex];
            let simRobot = { x: robot.x, y: robot.y, dir: robot.dir };
            let simStars = [];
            let history = [];
            let stepCount = 0;
            let result = { success: false, reason: "" };

            // Grid bounds check
            const isValid = (x, y) => x>=0 && x<6 && y>=0 && y<6;
            const isWall = (x, y) => !isValid(x,y) || lvl.map[y][x] === '#';

            function pushState(id) {
                history.push(cloneState(simRobot, id, simStars));
            }

            // initial state
            pushState(null);

            function executeAst(ast) {
                for(let b of ast) {
                    if(stepCount > 900) { result.reason = "โปรแกรมทำงานนานเกินไป (วนลูปไม่รู้จบ?)"; return false; }
                    stepCount++;
                    
                    if(b.type === 'f') {
                        let nx = simRobot.x; let ny = simRobot.y;
                        if(simRobot.dir === 0) ny--;
                        else if(simRobot.dir === 1) nx++;
                        else if(simRobot.dir === 2) ny++;
                        else if(simRobot.dir === 3) nx--;

                        if(isWall(nx, ny)) {
                            simRobot.x = nx; simRobot.y = ny; // Move into wall visually to crash
                            pushState(b.id);
                            result.reason = "เดินชนกำแพงหรือตกขอบแผนที่!";
                            return false;
                        }
                        simRobot.x = nx; simRobot.y = ny;
                        
                        // Check star
                        if(isValid(nx,ny) && lvl.map[ny][nx] === '*' && !simStars.includes(`${nx},${ny}`)) {
                            simStars.push(`${nx},${ny}`);
                        }
                        pushState(b.id);
                        
                        if(isValid(nx,ny) && lvl.map[ny][nx] === 'G') {
                            // Can continue moving even if flag reached in intermediate steps
                        }
                    }
                    else if(b.type === 'l') {
                        simRobot.dir = (simRobot.dir + 3) % 4;
                        pushState(b.id);
                    }
                    else if(b.type === 'r') {
                        simRobot.dir = (simRobot.dir + 1) % 4;
                        pushState(b.id);
                    }
                    else if(b.type === 'rep') {
                        pushState(b.id); // Highlight loop block
                        for(let i=0; i<b.val; i++) {
                            if(!executeAst(b.children)) return false;
                        }
                    }
                    else if(b.type === 'until') {
                        pushState(b.id);
                        let limit = 0;
                        while(true) {
                            if(limit++ > 60) { result.reason = "วนซ้ำนานเกิน 60 รอบ!"; return false; }
                            if(isValid(simRobot.x, simRobot.y) && lvl.map[simRobot.y][simRobot.x] === 'G') {
                                break; // Reached flag
                            }
                            if(!executeAst(b.children)) return false;
                            pushState(b.id); // re-highlight loop start
                        }
                    }
                    else if(b.type === 'ifw') {
                        pushState(b.id);
                        let nx = simRobot.x; let ny = simRobot.y;
                        if(simRobot.dir === 0) ny--;
                        else if(simRobot.dir === 1) nx++;
                        else if(simRobot.dir === 2) ny++;
                        else if(simRobot.dir === 3) nx--;

                        if(isWall(nx, ny)) {
                            if(!executeAst(b.children)) return false;
                        }
                    }
                }
                return true;
            }

            let ok = executeAst(programAst);
            
            // Check win condition at the end
            if(ok) {
                let onFlag = isValid(simRobot.x, simRobot.y) && lvl.map[simRobot.y][simRobot.x] === 'G';
                let totalStars = 0;
                for(let r of lvl.map) {
                    for(let c of r) {
                        if(c === '*') totalStars++;
                    }
                }
                
                if(onFlag && simStars.length === totalStars) {
                    result.success = true;
                    result.reason = "สำเร็จ!";
                } else if(!onFlag) {
                    result.reason = "โปรแกรมจบแล้ว แต่ยังไม่ถึงธง!";
                } else {
                    result.reason = "ถึงธงแล้ว แต่เก็บดาวไม่ครบ!";
                }
            }

            return { history, result };
        }

        function drawMap() {
            const cvs = document.getElementById('game-canvas');
            const ctx = cvs.getContext('2d');
            const w = cvs.width;
            const h = cvs.height;
            const tileSize = w / 6;

            ctx.clearRect(0, 0, w, h);

            // Draw Grid
            ctx.strokeStyle = 'rgba(255, 182, 193, 0.6)';
            ctx.lineWidth = 1;
            for(let i=0; i<=6; i++) {
                ctx.beginPath();
                ctx.moveTo(i*tileSize, 0); ctx.lineTo(i*tileSize, h);
                ctx.moveTo(0, i*tileSize); ctx.lineTo(w, i*tileSize);
                ctx.stroke();
            }

            // Draw Elements
            for(let y=0; y<6; y++) {
                for(let x=0; x<6; x++) {
                    const char = mapData[y]?.[x];
                    const px = x * tileSize;
                    const py = y * tileSize;

                    if(char === '#') {
                        // Wall (Brick pattern)
                        ctx.fillStyle = '#f0c6c6';
                        ctx.fillRect(px+2, py+2, tileSize-4, tileSize-4);
                        ctx.strokeStyle = '#e0a8a8';
                        ctx.lineWidth = 2;
                        ctx.strokeRect(px+2, py+2, tileSize-4, tileSize-4);
                    }
                    else if(char === 'G') {
                        // Flag
                        ctx.fillStyle = 'white';
                        ctx.fillRect(px + tileSize*0.2, py + tileSize*0.2, 4, tileSize*0.6);
                        ctx.fillStyle = varColor('--accent-red');
                        ctx.beginPath();
                        ctx.moveTo(px + tileSize*0.2 + 4, py + tileSize*0.2);
                        ctx.lineTo(px + tileSize*0.8, py + tileSize*0.35);
                        ctx.lineTo(px + tileSize*0.2 + 4, py + tileSize*0.5);
                        ctx.fill();
                    }
                    else if(char === '*' || char === 'S') {
                        // Check if collected
                        if(char === '*') {
                            const isCollected = collectedStars.includes(`${x},${y}`);
                            if(!isCollected) {
                                drawStar(ctx, px + tileSize/2, py + tileSize/2, 5, tileSize*0.3, tileSize*0.15, varColor('--accent-yellow'));
                            }
                        }
                        if(char === 'S') {
                            ctx.fillStyle = 'rgba(255, 182, 193, 0.3)';
                            ctx.fillRect(px, py, tileSize, tileSize);
                            ctx.fillStyle = '#5c4349';
                            ctx.font = '12px Sarabun';
                            ctx.fillText('START', px+4, py+tileSize-4);
                        }
                    }
                }
            }

            // Draw Robot
            const rx = robot.x * tileSize + tileSize/2;
            const ry = robot.y * tileSize + tileSize/2;
            
            ctx.save();
            ctx.translate(rx, ry);
            ctx.rotate(robot.dir * Math.PI / 2);
            
            // Robot Body (Circle with directional triangle)
            ctx.fillStyle = varColor('--accent-blue');
            ctx.beginPath();
            ctx.arc(0, 0, tileSize*0.35, 0, Math.PI*2);
            ctx.fill();
            ctx.strokeStyle = '#5c4349';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Direction arrow
            ctx.fillStyle = '#5c4349';
            ctx.beginPath();
            ctx.moveTo(0, -tileSize*0.2); // Pointing Up (North = 0)
            ctx.lineTo(-tileSize*0.15, 0);
            ctx.lineTo(tileSize*0.15, 0);
            ctx.fill();
            
            ctx.restore();
        }

        function drawStar(ctx, cx, cy, spikes, outerRadius, innerRadius, color) {
            let rot = Math.PI / 2 * 3;
            let x = cx;
            let y = cy;
            let step = Math.PI / spikes;

            ctx.beginPath();
            ctx.moveTo(cx, cy - outerRadius);
            for(let i = 0; i < spikes; i++) {
                x = cx + Math.cos(rot) * outerRadius;
                y = cy + Math.sin(rot) * outerRadius;
                ctx.lineTo(x, y);
                rot += step;

                x = cx + Math.cos(rot) * innerRadius;
                y = cy + Math.sin(rot) * innerRadius;
                ctx.lineTo(x, y);
                rot += step;
            }
            ctx.lineTo(cx, cy - outerRadius);
            ctx.closePath();
            ctx.fillStyle = color;
            ctx.fill();
        }

        function varColor(name) {
            return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
        }

        function stopAnimation() {
            if(animationTimer) clearTimeout(animationTimer);
            isPlaying = false;
            activeBlockId = null;
        }

        function showMessage(text, type) {
            const box = document.getElementById('message-box');
            box.innerText = text;
            box.className = `message-box ${type}`;
        }

        function playSimulation() {
            if(isPlaying) return;
            resetMap(); // visually reset
            
            if(programAst.length === 0) {
                showMessage("โปรแกรมว่างเปล่า! กรุณาวางบล็อกคำสั่ง", "msg-error");
                return;
            }

            const sim = simulate();
            simHistory = sim.history;
            animFrame = 0;
            isPlaying = true;
            
            showMessage("กำลังทำงาน...", "");

            if(prefersReducedMotion) {
                // Jump to end
                animFrame = simHistory.length - 1;
                stepAnimation(sim.result);
                isPlaying = false;
            } else {
                nextFrame(sim.result);
            }
        }

        function nextFrame(finalResult) {
            if(!isPlaying) return;
            
            stepAnimation(finalResult);

            if(animFrame < simHistory.length - 1) {
                animFrame++;
                let delay = playbackSpeed === 1 ? 800 : (playbackSpeed === 2 ? 400 : 100);
                animationTimer = setTimeout(() => nextFrame(finalResult), delay);
            } else {
                isPlaying = false;
            }
        }

        function stepAnimation(finalResult) {
            const state = simHistory[animFrame];
            robot.x = state.x;
            robot.y = state.y;
            robot.dir = state.dir;
            activeBlockId = state.activeId;
            collectedStars = state.collectedStars;
            
            drawMap();
            renderProgram(); // Update highlights

            if(animFrame === simHistory.length - 1) {
                activeBlockId = null;
                renderProgram();
                
                if(finalResult.success) {
                    const count = countTotalBlocks(programAst);
                    const par = LEVELS[currentLevelIndex].par;
                    let stars = 1;
                    if(count <= par) stars = 3;
                    else if(count <= par + 3) stars = 2;
                    
                    showMessage(`สำเร็จ! ได้ ${stars} ดาว (ใช้ ${count} บล็อก)`, "msg-success");
                    
                    if(stars > starsRecord[currentLevelIndex]) {
                        starsRecord[currentLevelIndex] = stars;
                        saveStars();
                        updateUIStars();
                    }
                } else {
                    showMessage(`ไม่สำเร็จ: ${finalResult.reason}`, "msg-error");
                }
            }
        }

        function setupEvents() {
            document.getElementById('btn-run').onclick = playSimulation;
            
            document.getElementById('btn-reset').onclick = () => {
                stopAnimation();
                resetMap();
                renderProgram();
            };
            
            document.getElementById('btn-clear').onclick = () => {
                stopAnimation();
                programAst = [];
                insertionTargetId = null;
                resetMap();
                renderProgram();
            };
            
            document.getElementById('btn-solution').onclick = () => {
                stopAnimation();
                // Deep copy solution
                programAst = JSON.parse(JSON.stringify(LEVELS[currentLevelIndex].solution));
                
                // assign IDs
                let sid = 1000;
                function assignId(ast) {
                    for(let b of ast) {
                        b.id = sid++;
                        if(b.children) assignId(b.children);
                    }
                }
                assignId(programAst);
                insertionTargetId = null;
                resetMap();
                renderProgram();
                showMessage("โหลดแนวทางแล้ว กดเริ่มทำงานเพื่อดูผลลัพธ์", "msg-success");
            };

            document.getElementById('btn-target-root').onclick = () => {
                insertionTargetId = null;
                updateRootTargetBtn();
                renderProgram();
            };

            document.querySelectorAll('.speed-btn').forEach(btn => {
                btn.onclick = (e) => {
                    playbackSpeed = parseInt(e.target.getAttribute('data-speed'));
                    document.querySelectorAll('.speed-btn').forEach(b => {
                        b.style.background = 'rgba(255, 255, 255, 0.9)';
                        b.style.color = 'var(--text-main)';
                    });
                    e.target.style.background = 'var(--accent-red)';
                    e.target.style.color = '#fff';
                };
            });
        }

        // Start
        window.onload = init;

    </script>
</body>
